    <path d="M256 250 C302 250 330 278 330 312 C330 350 298 372 256 372 C214 372 182 350 182 312 C182 278 210 250 256 250 Z"/>
    <!-- ears -->
    <path d="M190 296 C188 272 190 248 196 228 C214 238 230 252 240 264 Z"/>
    <path d="M322 296 C324 272 322 248 316 228 C298 238 282 252 272 264 Z"/>
