  <!-- door -->
  <rect x="36" y="12" width="440" height="488" rx="60" fill="#3F8F7F"/>
  <rect x="41" y="17" width="430" height="478" rx="55" fill="none" stroke="#2F6E62" stroke-width="10"/>
